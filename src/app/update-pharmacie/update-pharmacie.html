<div class="container mt-4">
  <div class="card shadow">
    <div class="card-body">
      <h3>Modifier une pharmacie</h3>
      <form (ngSubmit)="updatePharmacie()">
        <div class="mb-3">
          <label class="form-label">ID</label>
          <input type="number" class="form-control" name="idPharmacie" [(ngModel)]="currentPharmacie.idPharmacie" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" name="nomPharmacie" [(ngModel)]="currentPharmacie.nomPharmacie" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Adresse</label>
          <input type="text" class="form-control" name="adressePharmacie" [(ngModel)]="currentPharmacie.adressePharmacie" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Téléphone</label>
          <input type="text" class="form-control" name="telephonePharmacie" [(ngModel)]="currentPharmacie.telephonePharmacie" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date d'ouverture</label>
          <input type="date" class="form-control" name="dateOuverture" [(ngModel)]="dateOuvertureStr" required>
        </div>
        <button type="submit" class="btn btn-success">Modifier</button>
      </form>
    </div>
  </div>
</div>
